<style>

<a id="install" href="javascript:%28function%20openGlobalChatFrame%28%29%20%7B%0A%20%20%27use%20strict%27%3B%0A%0A%20%20const%20ID%20%3D%20%27global-chat-iframe-window%27%3B%0A%20%20const%20existing%20%3D%20document.getElementById%28ID%29%3B%0A%20%20if%20%28existing%29%20%7B%0A%20%20%20%20existing.hidden%20%3D%20%21existing.hidden%3B%0A%20%20%20%20return%3B%0A%20%20%7D%0A%0A%20%20const%20panel%20%3D%20document.createElement%28%27section%27%29%3B%0A%20%20panel.id%20%3D%20ID%3B%0A%20%20panel.setAttribute%28%27aria-label%27%2C%20%27Global%20Chat%20window%27%29%3B%0A%20%20panel.style.cssText%20%3D%20%5B%0A%20%20%20%20%27position%3Afixed%27%2C%0A%20%20%20%20%27top%3A24px%27%2C%0A%20%20%20%20%27right%3A24px%27%2C%0A%20%20%20%20%27width%3Amin%28430px%2Ccalc%28100vw%20-%2032px%29%29%27%2C%0A%20%20%20%20%27height%3Amin%28720px%2Ccalc%28100vh%20-%2048px%29%29%27%2C%0A%20%20%20%20%27min-width%3A300px%27%2C%0A%20%20%20%20%27min-height%3A360px%27%2C%0A%20%20%20%20%27z-index%3A2147483647%27%2C%0A%20%20%20%20%27display%3Aflex%27%2C%0A%20%20%20%20%27flex-direction%3Acolumn%27%2C%0A%20%20%20%20%27overflow%3Ahidden%27%2C%0A%20%20%20%20%27resize%3Aboth%27%2C%0A%20%20%20%20%27border%3Anone%27%2C%0A%20%20%20%20%27border-radius%3A20px%27%2C%0A%20%20%20%20%27box-shadow%3A0%2024px%2080px%20rgba%280%2C0%2C0%2C.35%29%27%2C%0A%20%20%20%20%27background%3Atransparent%27%0A%20%20%5D.join%28%27%3B%27%29%3B%0A%0A%20%20const%20frame%20%3D%20document.createElement%28%27iframe%27%29%3B%0A%20%20frame.src%20%3D%20%27https%3A%2F%2Fferrieberrie.github.io%2Frandominfo%2Fapp%27%3B%0A%20%20frame.title%20%3D%20%27Global%20Chat%27%3B%0A%20%20frame.allow%20%3D%20%27clipboard-write%3B%20autoplay%27%3B%0A%20%20frame.referrerPolicy%20%3D%20%27no-referrer%27%3B%0A%20%20frame.style.cssText%20%3D%20%27width%3A100%25%3Bheight%3A100%25%3Bflex%3A1%3Bborder%3A0%3Bborder-radius%3A20px%3Bbackground%3Awhite%27%3B%0A%0A%20%20panel.append%28frame%29%3B%0A%20%20document.documentElement.append%28panel%29%3B%0A%0A%20%20document.addEventListener%28%27keydown%27%2C%20%28e%29%20%3D%3E%20%7B%0A%20%20%20%20if%20%28e.key%20%3D%3D%3D%20%27%3B%27%29%20%7B%0A%20%20%20%20%20%20panel.hidden%20%3D%20%21panel.hidden%3B%0A%20%20%20%20%7D%0A%20%20%7D%29%3B%0A%0A%20%20window.addEventListener%28%27message%27%2C%20%28e%29%20%3D%3E%20%7B%0A%20%20%20%20if%20%28%21e.data%29%20return%3B%0A%20%20%20%20if%20%28e.data%20%3D%3D%3D%20%27toggle%27%20%7C%7C%20e.data.key%20%3D%3D%3D%20%27%3B%27%29%20%7B%0A%20%20%20%20%20%20panel.hidden%20%3D%20%21panel.hidden%3B%0A%20%20%20%20%7D%0A%20%20%20%20if%20%28e.data%20%3D%3D%3D%20%27jumpscare%27%20%7C%7C%20%28typeof%20e.data%20%3D%3D%3D%20%27object%27%20%26%26%20e.data.type%20%3D%3D%3D%20%27jumpscare%27%29%29%20%7B%0A%20%20%20%20%20%20runFullJumpscare%28e.data%29%3B%0A%20%20%20%20%7D%0A%20%20%7D%29%3B%0A%0A%20%20function%20runFullJumpscare%28data%29%20%7B%0A%20%20%20%20const%20scareId%20%3D%20%27full-page-jumpscare-overlay%27%3B%0A%20%20%20%20if%20%28document.getElementById%28scareId%29%29%20return%3B%0A%20%20%20%20const%20overlay%20%3D%20document.createElement%28%27div%27%29%3B%0A%20%20%20%20overlay.id%20%3D%20scareId%3B%0A%20%20%20%20overlay.style.cssText%20%3D%20%27position%3Afixed%3Btop%3A0%3Bleft%3A0%3Bwidth%3A100vw%3Bheight%3A100vh%3Bbackground%3Ablack%3Bz-index%3A2147483647%3Bdisplay%3Aflex%3Balign-items%3Acenter%3Bjustify-content%3Acenter%3Boverflow%3Ahidden%27%3B%0A%20%20%20%20const%20img%20%3D%20document.createElement%28%27img%27%29%3B%0A%20%20%20%20img.src%20%3D%20%28typeof%20data%20%3D%3D%3D%20%27object%27%20%26%26%20data.img%29%20%3F%20data.img%20%3A%20%27https%3A%2F%2Fi.imgur.com%2F3pQ2V2p.jpg%27%3B%0A%20%20%20%20img.style.cssText%20%3D%20%27width%3A100%25%3Bheight%3A100%25%3Bobject-fit%3Acover%27%3B%0A%20%20%20%20const%20audio%20%3D%20new%20Audio%28%28typeof%20data%20%3D%3D%3D%20%27object%27%20%26%26%20data.audio%29%20%3F%20data.audio%20%3A%20%27https%3A%2F%2Fwww.myinstants.com%2Fmedia%2Fsounds%2Fscreamer.mp3%27%29%3B%0A%20%20%20%20audio.autoplay%20%3D%20true%3B%0A%20%20%20%20audio.play%28%29.catch%28%28%29%20%3D%3E%20%7B%7D%29%3B%0A%20%20%20%20overlay.appendChild%28img%29%3B%0A%20%20%20%20%28document.body%20%7C%7C%20document.documentElement%29.appendChild%28overlay%29%3B%0A%20%20%20%20setTimeout%28%28%29%20%3D%3E%20overlay.remove%28%29%2C%20%28typeof%20data%20%3D%3D%3D%20%27object%27%20%26%26%20data.duration%29%20%7C%7C%203000%29%3B%0A%20%20%7D%0A%7D%29%28%29%3B">Drag me into your bookmarks bar</a>
<p>This is a chat where all users using it can communicate with eachother.</p>
</main>
<script>
const bookmarklet = function openGlobalChatFrame() {
  'use strict';

  const ID = 'global-chat-iframe-window';
  const existing = document.getElementById(ID);
  if (existing) {
    existing.hidden = !existing.hidden;
    return;
  }

  const width = Math.min(430, innerWidth - 32);
  const height = Math.min(720, innerHeight - 48);
  const panel = document.createElement('section');
  panel.id = ID;
  panel.setAttribute('aria-label', 'Global Chat window');
  panel.style.cssText = [
    'position:fixed',
    'top:24px',
    'left:' + Math.max(16, innerWidth - width - 24) + 'px',
    'width:' + width + 'px',
    'height:' + height + 'px',
    'min-width:300px',
    'min-height:360px',
    'z-index:2147483647',
    'display:flex',
    'flex-direction:column',
    'overflow:hidden',
    'resize:both',
    'border:none',
    'border-radius:20px',
    'box-shadow:0 24px 80px rgba(0,0,0,.35)',
    'background:transparent'
  ].join(';');

  const APP_URL = 'https://ferrieberrie.github.io/randominfo/app';
  const frame = document.createElement('iframe');
  frame.src = APP_URL;
  frame.title = 'Global Chat';
  frame.allow = 'clipboard-write; autoplay';
  frame.referrerPolicy = 'no-referrer';
  frame.style.cssText = 'width:100%;height:100%;flex:1;border:0;border-radius:20px;background:white';

  const dragHandle = document.createElement('div');
  dragHandle.title = 'Drag to move';
  dragHandle.setAttribute('aria-label', 'Drag chat window');
  dragHandle.style.cssText = 'position:absolute;z-index:2147483647;top:0;left:64px;right:64px;height:14px;cursor:move;touch-action:none;background:linear-gradient(#9ca3af,#9ca3af) center 4px/42px 4px no-repeat;border-radius:20px';

  panel.append(frame, dragHandle);
  document.documentElement.append(panel);

  let drag = null;
  dragHandle.addEventListener('pointerdown', event => {
    if (event.button !== 0) return;
    const bounds = panel.getBoundingClientRect();
    drag = {pointerId:event.pointerId, x:event.clientX, y:event.clientY, left:bounds.left, top:bounds.top};
    dragHandle.setPointerCapture(event.pointerId);
    event.preventDefault();
  });
  dragHandle.addEventListener('pointermove', event => {
    if (!drag || event.pointerId !== drag.pointerId) return;
    panel.style.left = Math.min(Math.max(0, drag.left + event.clientX - drag.x), Math.max(0, innerWidth - panel.offsetWidth)) + 'px';
    panel.style.top = Math.min(Math.max(0, drag.top + event.clientY - drag.y), Math.max(0, innerHeight - panel.offsetHeight)) + 'px';
  });
  const stopDrag = event => {
    if (drag && event.pointerId === drag.pointerId) drag = null;
  };
  dragHandle.addEventListener('pointerup', stopDrag);
  dragHandle.addEventListener('pointercancel', stopDrag);

  const onSemicolon = event => {
    if ((event.key === ';' || event.code === 'Semicolon') && !event.ctrlKey && !event.altKey && !event.metaKey) {
      event.preventDefault();
      event.stopImmediatePropagation();
      panel.hidden = !panel.hidden;
    }
  };
  document.addEventListener('keydown', onSemicolon, true);

  window.addEventListener('message', event => {
    if (event.source !== frame.contentWindow || !event.data) return;
    if (event.data === 'toggle' || event.data.key === ';') panel.hidden = !panel.hidden;
    if (typeof event.data === 'object' && event.data.type === 'hide') panel.hidden = true;
    if (event.data === 'jumpscare' || (typeof event.data === 'object' && event.data.type === 'jumpscare')) runFullJumpscare(event.data);
  });

  function runFullJumpscare(data) {
    const scareId = 'full-page-jumpscare-overlay';
    if (document.getElementById(scareId)) return;
    const overlay = document.createElement('div');
    overlay.id = scareId;
    overlay.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;background:black;z-index:2147483647;display:flex;align-items:center;justify-content:center;overflow:hidden';
    const img = document.createElement('img');
    img.src = (typeof data === 'object' && data.img) ? data.img : 'https://i.imgur.com/3pQ2V2p.jpg';
    img.style.cssText = 'width:100%;height:100%;object-fit:cover';
    const audio = new Audio((typeof data === 'object' && data.audio) ? data.audio : 'https://www.myinstants.com/media/sounds/screamer.mp3');
    audio.play().catch(() => {});
    overlay.append(img);
    (document.body || document.documentElement).append(overlay);
    setTimeout(() => overlay.remove(), (typeof data === 'object' && data.duration) || 3000);
  }
};
document.getElementById('install').href = 'javascript:' + encodeURIComponent('(' + bookmarklet.toString() + ')();');
</script>
</body>
</html>
